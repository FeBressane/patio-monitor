groups:
  - name: patio-monitor
    rules:
      - alert: LatenciaP95PosicoesAlta
        # Meta do produto, medida de verdade: p95 de /posicoes abaixo de 300 ms
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{handler=~"/posicoes|/api/posicoes"}[5m]))) > 0.3
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "p95 de /posicoes acima de 300 ms"
      - alert: TaxaDeErros5xx
        expr: |
          sum by (job) (rate(http_requests_total{status="5xx"}[5m])) / clamp_min(sum by (job) (rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Mais de 5% das requisições com erro 5xx"
      - alert: ApiFora
        expr: up{job=~"patio-.*"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "API do Pátio Monitor fora do ar"
