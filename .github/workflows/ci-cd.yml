name: CI/CD Pátio Monitor

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  segredos:
    name: Gitleaks (segredos no histórico)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # CLI oficial varrendo TODO o histórico (a action quebra no primeiro push de um repo novo).
      - name: Gitleaks (histórico completo)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  sast:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/dockerfile --config p/terraform --error --metrics=off

  iac-e-deps:
    name: Trivy (IaC e dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  build:
    name: Build e Trivy das imagens
    needs: [testes, segredos, sast, iac-e-deps]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servico: [api, front]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t patio-${{ matrix.servico }}:${{ github.sha }} ./${{ matrix.servico }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: patio-${{ matrix.servico }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Deploy no Azure App Service (F1, custo zero)
    needs: build
    # Só publica depois que a Azure estiver configurada (variável de repositório DEPLOY_HABILITADO=true).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_HABILITADO == 'true'
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4

      - name: Montar pacote (API + front + export da Ouro)
        run: |
          mkdir -p pacote
          cp -r api/app api/requirements.txt pacote/
          cp -r front pacote/front
          rm -f pacote/front/Dockerfile pacote/front/nginx.conf
          mkdir -p pacote/data && cp -r data/ouro pacote/data/ 2>/dev/null || true

      - name: Login na Azure (service principal com acesso só ao resource group)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Gravar segredos no App Service (vindos do GitHub Secrets)
        run: |
          az webapp config appsettings set -g "${{ secrets.AZURE_RESOURCE_GROUP }}" -n "${{ secrets.AZURE_WEBAPP_NAME }}" \
            --settings INGEST_API_KEY="${{ secrets.INGEST_API_KEY }}" METRICS_TOKEN="${{ secrets.METRICS_TOKEN }}" \
                       ASSISTENTE_URL="${{ secrets.ASSISTENTE_URL }}" --output none

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: pacote

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/health" && exit 0
            sleep 10
          done
          echo "health check falhou" && exit 1

      - name: Logout
        if: always()
        run: az logout
