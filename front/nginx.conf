server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # A API fica atrás do mesmo domínio: /api/posicoes -> api:8000/posicoes
    # Resolve "api" pelo DNS do Docker a cada 10 s: se o container da API for recriado (IP novo),
    # o nginx não fica preso no IP antigo (o que dava 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # /metrics não fica exposto publicamente; o Prometheus lê direto da rede interna
    location = /api/metrics { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
